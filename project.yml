name: HospitalChart
options:
  bundleIdPrefix: com.ajoupsychiatry
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.2"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
targets:
  HospitalChart:
    type: application
    platform: macOS
    sources:
      - HospitalChart
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: HospitalChart/Info.plist
      properties:
        CFBundleDisplayName: 아주 정신과 차트
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2025 아주대학교병원 정신건강의학과"
        NSPrincipalClass: NSApplication
    entitlements:
      path: HospitalChart/HospitalChart.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
